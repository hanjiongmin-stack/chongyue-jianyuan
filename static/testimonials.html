<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>学长学姐说 · 学员故事 | 崇岳鉴渊</title>
<!--cy:head-->
<style>
.tq{position:relative;display:grid;gap:28px;align-items:center;padding:clamp(26px,4vw,48px);border-radius:32px;border:1px solid var(--line-2);background:radial-gradient(80% 120% at 0% 0%,color-mix(in srgb,var(--c,var(--a1)) 18%,transparent),transparent 60%),var(--panel);box-shadow:var(--shadow);overflow:hidden;transition:background .8s}
@media(min-width:960px){.tq{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}}
.tq .mark{position:absolute;right:28px;top:-30px;font-family:var(--font-serif);font-size:15rem;line-height:1;color:color-mix(in srgb,var(--c,var(--a1)) 22%,transparent);pointer-events:none}
.tq blockquote{position:relative;font-size:clamp(1.15rem,2.2vw,1.55rem);line-height:1.75;font-weight:500;color:var(--fg);letter-spacing:-.005em;min-height:7.5em}
.tq blockquote .w{display:inline-block;opacity:0;transform:translateY(8px);animation:tq-in .5s var(--ease) forwards}
@keyframes tq-in{to{opacity:1;transform:none}}
.who{display:flex;align-items:center;gap:14px;margin-top:22px}
.who .av{width:56px;height:56px;border-radius:50%;padding:2px;background:conic-gradient(from var(--ang),var(--c,#8b5cf6),#3b82f6,#06b6d4,var(--c,#8b5cf6));animation:cy-rot 6s linear infinite}
.who .av span{width:100%;height:100%;border-radius:50%;display:grid;place-items:center;font-size:22px;font-weight:800;background:var(--solid)}
.who b{display:block;font-size:16px}
.who small{font-size:13px;color:var(--muted)}
.side{display:grid;gap:12px}
.side .metric{padding:18px 20px;border-radius:20px;border:1px solid color-mix(in srgb,var(--c,var(--a1)) 35%,transparent);background:color-mix(in srgb,var(--c,var(--a1)) 8%,transparent)}
.side .metric small{font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;color:var(--muted)}
.side .metric b{display:block;margin-top:6px;font-size:1.15rem;font-weight:700;line-height:1.5}
.side .used{padding:18px 20px;border-radius:20px;border:1px solid var(--line);background:var(--card)}
.side .used small{font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;color:var(--muted)}
.side .used .chips{margin-top:10px}
.ctl{display:flex;align-items:center;gap:14px;margin-top:22px}
.dots{display:flex;gap:8px;flex:1}
.dots button{position:relative;flex:1;max-width:120px;height:4px;border-radius:4px;background:var(--line-2);overflow:hidden}
.dots button i{position:absolute;inset:0;width:0;background:var(--grad)}
.dots button.done i{width:100%}
.cnt{font-family:var(--font-mono);font-size:13px;color:var(--muted);min-width:4.5em;text-align:right}
.grid3{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}
.story{display:flex;flex-direction:column;gap:12px;padding:22px;border-radius:22px;border:1px solid var(--line);background:var(--panel);box-shadow:var(--panel-shadow);cursor:pointer;text-align:left;transition:transform .45s var(--ease),border-color .3s}
.story:hover,.story.on{transform:translateY(-4px);border-color:color-mix(in srgb,var(--c) 45%,transparent)}
.story p{font-size:14px;color:var(--fg-2);line-height:1.8;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.story .who{margin-top:auto}
.story .who .av{width:40px;height:40px}.story .who .av span{font-size:16px}
.cta-lite{text-align:center;padding:64px 24px;border-radius:32px;border:1px solid var(--line-2);background:radial-gradient(70% 120% at 50% 0%,color-mix(in srgb,var(--a1) 22%,transparent),transparent 65%),var(--card)}
.cta-lite h2{font-size:clamp(1.8rem,4vw,2.8rem);font-weight:800;letter-spacing:-.03em}
.cta-lite p{margin:14px auto 0;max-width:540px;color:var(--muted)}
.cta-lite .ph-actions{justify-content:center}
@media(prefers-reduced-motion:reduce){.tq blockquote .w{animation:none;opacity:1;transform:none}}
</style>
</head>
<body>
<!--cy:nav-->
<main>
  <section class="page-hero center compact">
    <div class="ph-bg" aria-hidden="true"><i></i><i></i></div>
    <div class="container">
      <nav class="crumbs" aria-label="面包屑"><a href="/">首页</a><span>/</span><b style="font-weight:500;color:var(--fg-2)">学长学姐说</b></nav>
      <span class="eyebrow" data-reveal><i style="--c:var(--a4)"></i>Voices · 学长学姐说</span>
      <h1 class="ph-title" data-reveal style="--d:.05s">他们在这里<br><span class="grad-text">找到了方向</span></h1>
      <p class="ph-sub" data-reveal style="--d:.1s">竞赛、保研、开源与求职——来自崇岳鉴渊同学们的真实经历。</p>
    </div>
  </section>

  <section class="section tight" style="padding-top:12px">
    <div class="container">
      <div class="tq" id="tq" data-reveal="scale" aria-roledescription="carousel" aria-label="学员故事">
        <span class="mark" aria-hidden="true">“</span>
        <div>
          <blockquote id="tqText" aria-live="polite"></blockquote>
          <div class="who" id="tqWho"></div>
          <div class="ctl">
            <button class="icon-btn" type="button" id="prev" aria-label="上一条"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg></button>
            <div class="dots" id="dots"></div>
            <span class="cnt" id="cnt">01 / 03</span>
            <button class="icon-btn" type="button" id="next" aria-label="下一条"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg></button>
          </div>
        </div>
        <div class="side">
          <div class="metric"><small>OUTCOME · 成果</small><b id="tqMetric"></b></div>
          <div class="used"><small>USED · 用到的板块</small><div class="chips" id="tqUsed"></div></div>
        </div>
      </div>
    </div>
  </section>

  <section class="section tight">
    <div class="container">
      <div class="sec-head" data-reveal>
        <span class="eyebrow"><i></i>Stories · 全部故事</span>
        <h2 class="sec-title sm">点一张卡片，<span class="grad-text">听完整故事</span></h2>
      </div>
      <div class="grid3" id="stories"></div>
    </div>
  </section>

  <section class="section tight" style="padding-top:24px">
    <div class="container">
      <div class="cta-lite" data-reveal="scale">
        <h2>你的故事，<span class="grad-text">也值得被看见</span></h2>
        <p>在崇岳鉴渊拿到了竞赛奖项、保研名额或第一份实习？欢迎发邮件分享你的经历，经你同意后我们会展示在这里。</p>
        <div class="ph-actions"><a class="btn btn-primary btn-lg" href="mailto:hanjiongmin@hotmail.com?subject=%E5%88%86%E4%BA%AB%E6%88%91%E7%9A%84%E5%B4%87%E5%B2%B3%E9%89%B4%E6%B8%8A%E6%95%85%E4%BA%8B" data-magnetic>分享我的故事<svg class="arr" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 8h10M9 4l4 4-4 4"/></svg></a><a class="btn btn-ghost btn-lg" href="/pricing/start">免费开始</a></div>
      </div>
    </div>
  </section>
</main>
<!--cy:footer-->
<!--cy:tail-->
<script>
(function(){
'use strict';
var $=CY.$,$$=CY.$$,esc=CY.esc;
var T=[
  {q:'在崇岳鉴渊刷完历年数学竞赛真题后，我第一次看清了难题背后的几何本质。配合平台的 AI 编程工具，我把脑中的公式做成了可视化工具，拿到了 CMC 一等奖！',a:'陈同学',r:'数学与应用数学专业',o:'清华大学本科生',m:'CMC 数竞国一 / GitHub 1.2k Stars',c:'#a78bfa',u:[['数学竞赛真题库','/math'],['AI 编程','/ai-coding'],['高等数学','/math-hub']]},
  {q:'这里的大学生知识库质量太硬核了，直接终结了保研复习时的资料焦虑。利用 AI 编程工作流，我的大创项目研发效率翻了三倍不止。',a:'林学姐',r:'计算机科学与技术',o:'上海交通大学保研生',m:'直博保研成功 / 斩获 3 项竞赛大奖',c:'#22d3ee',u:[['知识库','/knowledge'],['升学备考','/knowledge?category=exam-prep'],['AI 编程','/ai-coding']]},
  {q:'最让我惊艳的是科研孵化板块。在这里跟随导师深度共建了一个高星 AI 开源框架，直接在简历里留下了沉甸甸的工程贡献记录。',a:'周同学',r:'数据科学与大数据技术',o:'浙江大学毕业生',m:'毕业直通大厂 AI 架构师岗位',c:'#f472b6',u:[['科研孵化','/research'],['星辰科研孵化圈','/pricing/elite'],['Python 数据分析','/python-course']]}
];
var i=0,DUR=7000,t0=0,raf=0,paused=false,box=$('#tq');
$('#dots').innerHTML=T.map(function(t,k){return '<button type="button" aria-label="第 '+(k+1)+' 条"><i></i></button>'}).join('');
$('#stories').innerHTML=T.map(function(t,k){return '<button type="button" class="story" data-k="'+k+'" style="--c:'+t.c+'" data-reveal><span class="badge" style="--c:'+t.c+'">'+esc(t.m.split(' / ')[0])+'</span><p>'+esc(t.q)+'</p><div class="who"><div class="av"><span>'+esc(t.a.charAt(0))+'</span></div><div><b>'+esc(t.a)+'</b><small>'+esc(t.o)+' · '+esc(t.r)+'</small></div></div></button>'}).join('');
function show(k){
  i=(k+T.length)%T.length;var t=T[i];
  box.style.setProperty('--c',t.c);
  $('#tqText').innerHTML=CY.reduced?esc(t.q):t.q.split('').map(function(ch,n){return '<span class="w" style="animation-delay:'+(n*.012).toFixed(3)+'s">'+esc(ch)+'</span>'}).join('');
  $('#tqWho').innerHTML='<div class="av"><span>'+esc(t.a.charAt(0))+'</span></div><div><b>'+esc(t.a)+'</b><small>'+esc(t.o)+' · '+esc(t.r)+'</small></div>';
  $('#tqMetric').textContent=t.m;
  $('#tqUsed').innerHTML=t.u.map(function(u){return '<a class="chip" href="'+u[1]+'">'+esc(u[0])+'</a>'}).join('');
  $('#cnt').textContent=String(i+1).padStart(2,'0')+' / '+String(T.length).padStart(2,'0');
  $$('#dots button').forEach(function(b,n){b.classList.toggle('done',n<i);b.setAttribute('aria-current',n===i?'true':'false');$('i',b).style.width=n<i?'100%':'0'});
  $$('.story').forEach(function(s,n){s.classList.toggle('on',n===i)});
  t0=performance.now();
}
function tick(now){
  raf=0;if(paused||document.hidden||CY.reduced)return;
  var p=Math.min((now-t0)/DUR,1),bar=$('#dots button:nth-child('+(i+1)+') i');if(bar)bar.style.width=(p*100)+'%';
  if(p>=1)show(i+1);
  raf=requestAnimationFrame(tick);
}
function play(){if(!raf&&!CY.reduced)raf=requestAnimationFrame(tick)}
$('#prev').addEventListener('click',function(){show(i-1)});
$('#next').addEventListener('click',function(){show(i+1)});
$('#dots').addEventListener('click',function(e){var b=e.target.closest('button');if(b)show($$('#dots button').indexOf(b))});
$('#stories').addEventListener('click',function(e){var s=e.target.closest('.story');if(!s)return;show(+s.getAttribute('data-k'));box.scrollIntoView({behavior:CY.reduced?'auto':'smooth',block:'center'})});
box.addEventListener('mouseenter',function(){paused=true});
box.addEventListener('mouseleave',function(){paused=false;t0=performance.now();play()});
document.addEventListener('keydown',function(e){var tag=(e.target.tagName||'').toLowerCase();if(tag==='input'||tag==='textarea')return;if(e.key==='ArrowLeft')show(i-1);else if(e.key==='ArrowRight')show(i+1)});
var sx=null;box.addEventListener('touchstart',function(e){sx=e.touches[0].clientX},{passive:true});box.addEventListener('touchend',function(e){if(sx===null)return;var dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>40)show(i+(dx<0?1:-1));sx=null},{passive:true});
document.addEventListener('visibilitychange',function(){if(!document.hidden){t0=performance.now();play()}});
show(0);play();
})();
</script>
</body>
</html>
