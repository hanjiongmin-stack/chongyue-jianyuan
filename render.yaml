services:
  - type: web
    name: chongyue-jianyuan
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn unified_server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: CYJY_SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.12.0"
      # 数学竞赛真题库在线阅读：R2 公网地址（如 https://pub-xxxx.r2.dev），在 Render 控制台填写
      - key: CYJY_MATH_FILES_URL
        sync: false
    autoDeploy: true
