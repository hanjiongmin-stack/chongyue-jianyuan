services:
  - type: web
    name: chongyue-jianyuan
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn unified_server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: CYJY_SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.12.0"
      # AI 学术助教的大模型（豆包 / 火山方舟），在 Render 控制台填写
      - key: DOUBAO_API_KEY
        sync: false
      - key: DOUBAO_ENDPOINT_ID
        sync: false
      # 数学竞赛真题库在线阅读（二选一，在 Render 控制台填写）
      # 推荐：Google API 密钥（启用 Google Drive API），直接读取公开的 Google Drive 文件夹
      - key: CYJY_GDRIVE_API_KEY
        sync: false
      # 或：Cloudflare R2 公网地址（如 https://pub-xxxx.r2.dev）
      - key: CYJY_MATH_FILES_URL
        sync: false
    autoDeploy: true
