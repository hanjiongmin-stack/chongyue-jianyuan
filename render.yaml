services:
  - type: web
    name: chongyue-jianyuan
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn unified_server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: CYJY_SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.12.0"
      # 管理员密码（至少 8 位），在 Render 控制台填写。线上不设置时不会创建管理员，也禁止用默认密码 admin123 登录
      - key: CYJY_ADMIN_PASSWORD
        sync: false
      # AI 学术助教的大模型（豆包 / 火山方舟），在 Render 控制台填写
      - key: DOUBAO_API_KEY
        sync: false
      - key: DOUBAO_ENDPOINT_ID
        sync: false
      # 数学竞赛真题库在线阅读（二选一，在 Render 控制台填写）
      # 推荐：Google API 密钥（启用 Google Drive API），直接读取公开的 Google Drive 文件夹
      - key: CYJY_GDRIVE_API_KEY
        sync: false
      # 或：Cloudflare R2 公网地址（如 https://pub-xxxx.r2.dev）
      - key: CYJY_MATH_FILES_URL
        sync: false
      # 管理后台内容管理：GitHub fine-grained 令牌（本仓库 Contents 读写），在 Render 控制台填写
      - key: CYJY_GITHUB_TOKEN
        sync: false
      # 持久化数据库：外部 Postgres 连接串（推荐 Neon 免费数据库），在 Render 控制台填写。
      # 不设置时数据库在临时磁盘上，每次重启或重新部署都会清空账号、收藏和学习进度
      - key: DATABASE_URL
        sync: false
    autoDeploy: true
