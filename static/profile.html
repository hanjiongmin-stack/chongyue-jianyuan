<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>个人中心 | 崇岳鉴渊</title>
<meta name="robots" content="noindex">
<!--cy:head-->
<style>
.pf-hero{padding-bottom:28px}
.pf-head{display:flex;flex-wrap:wrap;align-items:center;gap:22px}
.pf-av{position:relative;flex:none;width:96px;height:96px;border-radius:50%;padding:3px;background:conic-gradient(from var(--ang),#8b5cf6,#3b82f6,#06b6d4,#f472b6,#8b5cf6);animation:cy-rot 6s linear infinite}
.pf-av span{width:100%;height:100%;border-radius:50%;display:grid;place-items:center;font-size:38px;font-weight:800;color:var(--fg);background:var(--solid)}
.pf-id{flex:1;min-width:220px}
.pf-id h1{font-size:clamp(1.7rem,3.4vw,2.4rem);font-weight:800;letter-spacing:-.02em;line-height:1.2}
.pf-id p{margin-top:4px;color:var(--muted);font-size:14.5px}
.pf-badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.stats{display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr));margin-top:26px}
@media(min-width:760px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}}
.stat{padding:16px 18px;border-radius:18px;border:1px solid var(--line);background:var(--panel);box-shadow:var(--panel-shadow)}
.stat b{display:block;font-size:1.8rem;font-weight:800;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.pf-tabs{margin:8px 0 22px}
.pane{display:none}
.pane.on{display:block;animation:pf-in .35s var(--ease)}
@keyframes pf-in{from{opacity:0;transform:translateY(8px)}}
.ov{display:grid;gap:16px}
@media(min-width:960px){.ov{grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr)}}
.box{padding:22px;border-radius:22px;border:1px solid var(--line);background:var(--panel);box-shadow:var(--panel-shadow)}
.box h3{font-size:1.05rem;font-weight:700;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.box h3 a{font-size:13px;font-weight:500;color:var(--muted)}
.box h3 a:hover{color:var(--fg)}
.donut{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.donut svg{width:150px;height:150px;transform:rotate(-90deg);flex:none}
.donut circle{fill:none;stroke-width:16}
.donut .seg1{stroke:var(--ok)}.donut .seg2{stroke:var(--a2)}.donut .seg3{stroke:var(--line-2)}
.donut .seg1,.donut .seg2{transition:stroke-dasharray .9s var(--ease),stroke-dashoffset .9s var(--ease)}
.legend{display:grid;gap:10px;font-size:14px;color:var(--fg-2)}
.legend span{display:flex;align-items:center;gap:8px}
.legend i{width:10px;height:10px;border-radius:3px;background:var(--c)}
.legend b{margin-left:auto;padding-left:14px;font-variant-numeric:tabular-nums}
.cont{display:flex;gap:14px;align-items:center;padding:16px;border-radius:16px;border:1px solid color-mix(in srgb,var(--a1) 35%,transparent);background:color-mix(in srgb,var(--a1) 8%,transparent)}
.cont .card-ic{flex:none}
.cont b{display:block;font-size:15px}
.cont small{font-size:12.5px;color:var(--muted)}
.bar{height:6px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;border-radius:6px;background:var(--grad);width:0;transition:width .9s var(--ease)}
.acts{display:grid;gap:10px;grid-template-columns:repeat(2,minmax(0,1fr));margin-top:14px}
.acts a{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-size:14px;font-weight:600;transition:border-color .3s,transform .35s var(--ease)}
.acts a:hover{border-color:var(--line-2);transform:translateY(-2px)}
.acts a i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.list{display:grid;gap:10px}
.it{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:14px 16px;border-radius:16px;border:1px solid var(--line);background:var(--card);transition:border-color .3s}
.it:hover{border-color:var(--line-2)}
.it a.t{font-weight:600;color:var(--fg);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it a.t:hover{text-decoration:underline;text-underline-offset:4px}
.it .m{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:4px;font-size:12.5px;color:var(--muted);align-items:center}
.it .d{font-size:13px;color:var(--muted);margin-top:4px;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.it .r{display:flex;align-items:center;gap:8px}
.pct{font-family:var(--font-mono);font-size:13px;color:var(--fg-2);min-width:3.2em;text-align:right}
.set{display:grid;gap:16px}
@media(min-width:960px){.set{grid-template-columns:1fr 1fr;align-items:start}}
.plan-card{position:relative;padding:24px;border-radius:22px;border:1px solid transparent;background:linear-gradient(var(--solid),var(--solid)) padding-box,conic-gradient(from var(--ang),#a78bfa,#60a5fa,#22d3ee,#f472b6,#a78bfa) border-box;animation:cy-rot 8s linear infinite}
.plan-card small{font-family:var(--font-mono);font-size:11.5px;letter-spacing:.12em;color:var(--muted)}
.plan-card h3{margin:6px 0 8px;font-size:1.5rem;font-weight:800}
.loading-state{display:grid;place-items:center;min-height:50vh}
</style>
</head>
<body>
<!--cy:nav-->
<main>
  <div class="loading-state" id="loading"><div class="spinner"></div></div>
  <div id="app" hidden>
    <section class="page-hero pf-hero">
      <div class="ph-bg" aria-hidden="true"><i></i><i></i></div>
      <div class="container">
        <nav class="crumbs" aria-label="面包屑"><a href="/">首页</a><span>/</span><b style="font-weight:500;color:var(--fg-2)">个人中心</b></nav>
        <div class="pf-head" style="margin-top:18px">
          <div class="pf-av"><span id="av">U</span></div>
          <div class="pf-id">
            <h1 id="hName">同学</h1>
            <p id="hSub">—</p>
            <div class="pf-badges" id="badges"></div>
          </div>
          <a class="btn btn-ghost" href="#settings" data-go="settings">编辑资料</a>
        </div>
        <div class="stats">
          <div class="stat"><b id="sFav" data-count="0">0</b><span>收藏的资源</span></div>
          <div class="stat"><b id="sIng" data-count="0">0</b><span>学习中</span></div>
          <div class="stat"><b id="sDone" data-count="0">0</b><span>已完成</span></div>
          <div class="stat"><b id="sDays" data-count="0">0</b><span>加入天数</span></div>
        </div>
      </div>
    </section>

    <div class="container" style="padding-bottom:96px">
      <div class="seg pf-tabs" id="tabs" role="tablist" aria-label="个人中心分区">
        <button type="button" data-t="overview" class="on">学习概览</button><button type="button" data-t="favorites">我的收藏</button><button type="button" data-t="progress">学习进度</button><button type="button" data-t="settings">账号设置</button><button type="button" data-t="plan">我的权益</button>
      </div>

      <section class="pane on" id="p-overview">
        <div class="ov">
          <div class="box">
            <h3>学习状态分布</h3>
            <div class="donut">
              <svg viewBox="0 0 160 160" aria-hidden="true"><circle class="seg3" cx="80" cy="80" r="62"/><circle class="seg2" id="dIng" cx="80" cy="80" r="62"/><circle class="seg1" id="dDone" cx="80" cy="80" r="62"/></svg>
              <div class="legend"><span><i style="--c:var(--ok)"></i>已完成<b id="lDone">0</b></span><span><i style="--c:var(--a2)"></i>学习中<b id="lIng">0</b></span><span><i style="--c:var(--line-2)"></i>未开始<b id="lNot">0</b></span><span style="color:var(--muted)">平均进度<b id="lAvg">0%</b></span></div>
            </div>
          </div>
          <div class="box">
            <h3>继续学习<a href="#progress" data-go="progress">全部进度 →</a></h3>
            <div id="cont"></div>
            <div class="acts">
              <a href="/math"><i style="--c:#f59e0b"></i>数学竞赛真题库</a>
              <a href="/knowledge"><i style="--c:#8b5cf6"></i>知识库</a>
              <a href="/python-course"><i style="--c:#10b981"></i>Python 课程</a>
              <a href="/ai-coding"><i style="--c:#22d3ee"></i>AI 编程专区</a>
            </div>
          </div>
        </div>
        <div class="box" style="margin-top:16px">
          <h3>最近动态</h3>
          <div class="list" id="recent"></div>
        </div>
      </section>

      <section class="pane" id="p-favorites">
        <div class="list" id="favList"></div>
      </section>

      <section class="pane" id="p-progress">
        <div class="chips" id="pgFilter" style="margin-bottom:14px"><button type="button" class="chip on" data-f="all">全部</button><button type="button" class="chip" data-f="in_progress">学习中</button><button type="button" class="chip" data-f="completed">已完成</button><button type="button" class="chip" data-f="not_started">未开始</button></div>
        <div class="list" id="pgList"></div>
      </section>

      <section class="pane" id="p-settings">
        <div class="set">
          <form class="box" id="infoForm" novalidate>
            <h3>基本资料</h3>
            <div class="form-stack" style="margin-top:0">
              <div class="field"><label for="fUser">用户名</label><input class="input" id="fUser" disabled><span class="hint">用户名注册后不可修改</span></div>
              <div class="field"><label for="fName">显示名称</label><input class="input" id="fName" maxlength="40" placeholder="在站内显示的名字"><span class="ferr" hidden></span></div>
              <div class="field"><label for="fEmail">邮箱</label><input class="input" id="fEmail" type="email" inputmode="email"><span class="hint">精英矩阵审核按邮箱匹配账号</span><span class="ferr" hidden></span></div>
              <button class="btn btn-primary" type="submit" id="infoBtn">保存修改</button>
            </div>
          </form>
          <div style="display:grid;gap:16px">
            <form class="box" id="pwForm" novalidate>
              <h3>修改密码</h3>
              <div class="form-stack" style="margin-top:0">
                <div class="field"><label for="pOld">原密码</label><input class="input" id="pOld" type="password" autocomplete="current-password"><span class="ferr" hidden></span></div>
                <div class="field"><label for="pNew">新密码</label><input class="input" id="pNew" type="password" autocomplete="new-password" placeholder="至少 6 个字符"><span class="ferr" hidden></span></div>
                <div class="field"><label for="pNew2">确认新密码</label><input class="input" id="pNew2" type="password" autocomplete="new-password"><span class="ferr" hidden></span></div>
                <div class="note err" id="pwErr" hidden></div>
                <button class="btn btn-ghost" type="submit" id="pwBtn">更新密码</button>
              </div>
            </form>
            <div class="box">
              <h3>登录状态</h3>
              <p class="muted" style="font-size:14px;margin-bottom:14px">退出后需要重新登录才能使用收藏和学习进度。</p>
              <button class="btn btn-danger" type="button" id="outBtn">退出登录</button>
            </div>
          </div>
        </div>
      </section>

      <section class="pane" id="p-plan">
        <div class="set">
          <div class="plan-card"><small>CURRENT PLAN · 当前计划</small><h3 id="planName">溯熵新手池</h3><p class="muted" id="planDesc" style="font-size:14px;line-height:1.8"></p><div class="ph-actions" id="planActs" style="margin-top:18px"></div></div>
          <div class="box"><h3>权益一览</h3><ul class="checklist" id="planList"></ul></div>
        </div>
      </section>
    </div>
  </div>

  <div class="modal" id="outModal" role="dialog" aria-modal="true" aria-labelledby="outTitle">
    <div class="modal-box">
      <h3 id="outTitle" style="font-size:1.2rem;font-weight:700">确认退出登录？</h3>
      <p class="muted" style="margin-top:8px;font-size:14px;line-height:1.7">退出后需要重新登录才能使用收藏、学习进度等功能。</p>
      <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:20px"><button class="btn btn-ghost" type="button" data-close>取消</button><button class="btn btn-danger" type="button" id="outOk">确认退出</button></div>
    </div>
  </div>
</main>
<!--cy:footer-->
<!--cy:tail-->
<script>
(function(){
'use strict';
var $=CY.$,$$=CY.$$,esc=CY.esc;
var CK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6L9 17l-5-5"/></svg>';
function toLogin(){location.href='/login?redirect='+encodeURIComponent('/profile'+location.hash)}
if(!CY.token()){toLogin();return}
var ME=null,FAV=[],PG=[],pgFilter='all';
var PLANS={free:['溯熵新手池','低年级快速入门，破除高校信息差。',['历年数竞真题目录与在线阅读','精选专业课知识库','收藏与学习进度追踪','AI 编程基础向导','每日 AI 答疑额度']],start:['溯熵新手池','低年级快速入门，破除高校信息差。',['历年数竞真题目录与在线阅读','精选专业课知识库','收藏与学习进度追踪','AI 编程基础向导','每日 AI 答疑额度']],pro:['高能进阶舱','全面攻克硬核竞赛与工业级 AI 工程。',['全站竞赛真题 + LaTeX 解析','保研 / 考研知识库全量解锁','AI 编程进阶：排错与脚手架','知识管理同步指引','AI 导师 24h 答疑']],elite:['星辰科研孵化圈','面向开源贡献、前沿论文与顶尖实验室方向。',['包含高能进阶舱全部权益','开源练手项目组队 + PR 指导','论文复现与科研课题结伴','1v1 履历建议','精英矩阵专属入口']]};
function fmtDate(s){if(!s)return '—';var d=new Date(s);return isNaN(d)?'—':d.toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric'})}
function ago(s){var d=(Date.now()-new Date(s).getTime())/1000;if(!(d>=0))return '';if(d<60)return '刚刚';if(d<3600)return Math.floor(d/60)+' 分钟前';if(d<86400)return Math.floor(d/3600)+' 小时前';if(d<86400*30)return Math.floor(d/86400)+' 天前';return fmtDate(s)}
function count(el,n){el.setAttribute('data-count',n);CY.countUp(el)}

/* ---------- 分区切换（同步到 URL hash） ---------- */
function tab(t){
  if(!$('#p-'+t))t='overview';
  $$('#tabs button').forEach(function(b){var on=b.getAttribute('data-t')===t;b.classList.toggle('on',on);b.setAttribute('aria-selected',on?'true':'false')});
  $$('.pane').forEach(function(p){p.classList.toggle('on',p.id==='p-'+t)});
  try{history.replaceState(null,'',t==='overview'?location.pathname:'#'+t)}catch(e){}
}
$('#tabs').addEventListener('click',function(e){var b=e.target.closest('[data-t]');if(b)tab(b.getAttribute('data-t'))});
window.addEventListener('hashchange',function(){if(ME)tab((location.hash||'').slice(1)||'overview')});
document.addEventListener('click',function(e){var a=e.target.closest('[data-go]');if(a){e.preventDefault();tab(a.getAttribute('data-go'));$('#tabs').scrollIntoView({behavior:CY.reduced?'auto':'smooth',block:'center'})}});

/* ---------- 渲染 ---------- */
function renderMe(){
  var n=ME.display_name||ME.username,plan=ME.is_elite?'elite':(ME.subscription||'free');
  $('#av').textContent=String(n).charAt(0).toUpperCase();$('#hName').textContent=n;
  var ua=document.querySelector('#navAuth .user-avatar');if(ua){ua.textContent=String(n).charAt(0).toUpperCase();ua.title='个人中心 · '+n}
  $('#hSub').textContent='@'+ME.username+' · '+ME.email+' · 加入于 '+fmtDate(ME.created_at);
  var P=PLANS[plan]||PLANS.free;
  $('#badges').innerHTML='<span class="badge'+(plan==='elite'?' warn':plan==='pro'?' pink':'')+'">'+P[0]+'</span>'+(ME.is_elite?'<span class="badge warn">精英成员</span>':'')+(ME.is_admin?'<span class="badge err">管理员</span>':'');
  var days=ME.created_at?Math.max(1,Math.ceil((Date.now()-new Date(ME.created_at).getTime())/864e5)):1;count($('#sDays'),days);
  $('#fUser').value=ME.username;$('#fName').value=ME.display_name||'';$('#fEmail').value=ME.email||'';
  $('#planName').textContent=P[0];$('#planDesc').textContent=P[1];
  $('#planList').innerHTML=P[2].map(function(x){return '<li>'+CK+'<span>'+x+'</span></li>'}).join('');
  var acts=[];
  if(ME.is_elite||ME.is_admin)acts.push('<a class="btn btn-primary" href="/elite-matrix">进入精英矩阵</a>');
  if(ME.is_admin)acts.push('<a class="btn btn-ghost" href="/admin-elite">申请审核后台</a>');
  if(plan==='free'||plan==='start')acts.push('<a class="btn btn-primary" href="/pricing/pro">了解高能进阶舱</a>','<a class="btn btn-ghost" href="/pricing/elite">申请科研孵化圈</a>');
  if(plan==='pro'&&!ME.is_elite)acts.push('<a class="btn btn-ghost" href="/pricing/elite">申请科研孵化圈</a>');
  $('#planActs').innerHTML=acts.join('');
}
function empty(msg,href,cta){return '<div class="empty"><div class="em-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 5h7a3 3 0 0 1 3 3v12a2 2 0 0 0-2-2H2z"/><path d="M22 5h-7a3 3 0 0 0-3 3v12a2 2 0 0 1 2-2h8z"/></svg></div><b>'+msg+'</b><a class="btn btn-ghost btn-sm" href="'+href+'">'+cta+'</a></div>'}
function renderFav(){
  count($('#sFav'),FAV.length);
  $('#favList').innerHTML=FAV.length?FAV.map(function(f){return '<div class="it" data-id="'+(+f.resource_id)+'"><div style="min-width:0"><a class="t" href="/knowledge/'+(+f.resource_id)+'">'+esc(f.resource_title)+'</a><div class="m"><span class="badge">'+esc(f.category_name||'资源')+'</span><span>收藏于 '+ago(f.created_at)+'</span></div>'+(f.description?'<div class="d">'+esc(f.description)+'</div>':'')+'</div><div class="r"><button class="btn btn-ghost btn-xs" type="button" data-unfav="'+(+f.resource_id)+'">取消收藏</button></div></div>'}).join(''):empty('还没有收藏任何资源','/knowledge','去知识库看看');
}
function renderPg(){
  var done=PG.filter(function(p){return p.status==='completed'}),ing=PG.filter(function(p){return p.status==='in_progress'}),not=PG.length-done.length-ing.length;
  count($('#sIng'),ing.length);count($('#sDone'),done.length);
  $('#lDone').textContent=done.length;$('#lIng').textContent=ing.length;$('#lNot').textContent=not;
  var avg=PG.length?Math.round(PG.reduce(function(s,p){return s+(+p.progress_percent||0)},0)/PG.length):0;$('#lAvg').textContent=avg+'%';
  var C=2*Math.PI*62,tot=Math.max(1,PG.length),a=done.length/tot*C,b=ing.length/tot*C;
  $('#dDone').style.strokeDasharray=a+' '+C;$('#dIng').style.strokeDasharray=b+' '+C;$('#dIng').style.strokeDashoffset=-a;
  var cur=ing.slice().sort(function(x,y){return new Date(y.updated_at||0)-new Date(x.updated_at||0)})[0];
  $('#cont').innerHTML=cur?'<a class="cont" href="/knowledge/'+(+cur.resource_id)+'"><span class="card-ic" style="--c1:#8b5cf6;--c2:#3b82f6"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 3l14 9-14 9V3z"/></svg></span><div style="flex:1;min-width:0"><b>'+esc(cur.resource_title)+'</b><small>'+esc(cur.category_name||'')+' · 已完成 '+(+cur.progress_percent||0)+'% · '+ago(cur.updated_at)+'</small><div class="bar"><i style="width:'+(+cur.progress_percent||0)+'%"></i></div></div></a>':'<p class="muted" style="font-size:14px">还没有正在学习的资源。在知识库的资源详情页可以记录学习进度。</p>';
  var rec=PG.slice().sort(function(x,y){return new Date(y.updated_at||0)-new Date(x.updated_at||0)}).slice(0,5);
  $('#recent').innerHTML=rec.length?rec.map(item).join(''):empty('还没有学习记录','/knowledge','开始学习');
  var list=pgFilter==='all'?PG:PG.filter(function(p){return p.status===pgFilter});
  $('#pgList').innerHTML=list.length?list.map(item).join(''):empty(pgFilter==='all'?'还没有学习记录':'这个分类下暂时没有记录','/knowledge','去知识库');
}
var ST={completed:['已完成','ok'],in_progress:['学习中','info'],not_started:['未开始','']};
function item(p){var s=ST[p.status]||ST.not_started,v=+p.progress_percent||0;return '<div class="it"><div style="min-width:0"><a class="t" href="/knowledge/'+(+p.resource_id)+'">'+esc(p.resource_title)+'</a><div class="m"><span class="badge '+s[1]+'">'+s[0]+'</span><span>'+esc(p.category_name||'')+'</span><span>更新于 '+ago(p.updated_at)+'</span></div><div class="bar"><i style="width:'+v+'%"></i></div></div><div class="r"><span class="pct">'+v+'%</span></div></div>'}
$('#pgFilter').addEventListener('click',function(e){var c=e.target.closest('[data-f]');if(!c)return;pgFilter=c.getAttribute('data-f');$$('#pgFilter .chip').forEach(function(x){x.classList.toggle('on',x===c)});renderPg()});
$('#favList').addEventListener('click',function(e){
  var b=e.target.closest('[data-unfav]');if(!b)return;var id=b.getAttribute('data-unfav');b.disabled=true;
  CY.api('users/me/favorites/'+id,{method:'DELETE'}).then(function(r){if(!r.ok)throw 0;FAV=FAV.filter(function(f){return String(f.resource_id)!==id});renderFav();CY.toast('已取消收藏','ok')}).catch(function(){b.disabled=false;CY.toast('操作失败，请稍后重试','err')});
});

/* ---------- 设置 ---------- */
function fieldErr(el,msg){var f=el.closest('.field'),e=$('.ferr',f);f.classList.toggle('bad',!!msg);if(e){e.textContent=msg||'';e.hidden=!msg}}
$('#infoForm').addEventListener('submit',function(e){
  e.preventDefault();var n=$('#fName'),m=$('#fEmail'),b=$('#infoBtn');
  var e1=n.value.trim()?'':'显示名称不能为空',e2=/^[A-Za-z0-9_.+-]+@[A-Za-z0-9-]+\.[A-Za-z0-9.-]+$/.test(m.value.trim())?'':'请输入有效的邮箱地址';fieldErr(n,e1);fieldErr(m,e2);if(e1||e2)return;
  b.disabled=true;b.textContent='保存中…';
  CY.api('users/me',{method:'PUT',json:{display_name:n.value.trim(),email:m.value.trim()}}).then(function(r){
    if(!r.ok||!r.data){var msg=CY.errText(r.data,'保存失败');if(r.status===409)fieldErr(m,msg);else CY.toast(msg,'err');return}
    ME=r.data;try{localStorage.setItem('cyjy_user',JSON.stringify(ME))}catch(x){}renderMe();CY.toast('资料已更新','ok');
  }).catch(function(){CY.toast('网络错误，请稍后重试','err')}).then(function(){b.disabled=false;b.textContent='保存修改'});
});
$('#pwForm').addEventListener('submit',function(e){
  e.preventDefault();var o=$('#pOld'),n=$('#pNew'),n2=$('#pNew2'),err=$('#pwErr'),b=$('#pwBtn');err.hidden=true;
  var e1=o.value?'':'请输入原密码',e2=n.value.length<6?'新密码至少 6 个字符':n.value===o.value?'新密码不能与原密码相同':'',e3=n2.value!==n.value?'两次输入的新密码不一致':'';
  fieldErr(o,e1);fieldErr(n,e2);fieldErr(n2,e3);if(e1||e2||e3)return;
  b.disabled=true;b.textContent='更新中…';
  CY.api('users/me/password',{method:'PUT',json:{old_password:o.value,new_password:n.value}}).then(function(r){
    if(!r.ok){err.textContent=CY.errText(r.data,'修改失败');err.hidden=false;b.disabled=false;b.textContent='更新密码';return}
    CY.toast('密码已更新，请重新登录','ok');setTimeout(function(){CY.logout().then(function(){location.href='/login?redirect=%2Fprofile'})},1200);
  }).catch(function(){err.textContent='网络错误，请稍后重试';err.hidden=false;b.disabled=false;b.textContent='更新密码'});
});
var modal=$('#outModal');
function setModal(o){modal.classList.toggle('open',o);if(o)$('#outOk').focus()}
$('#outBtn').addEventListener('click',function(){setModal(true)});
modal.addEventListener('click',function(e){if(e.target===modal||e.target.closest('[data-close]'))setModal(false)});
document.addEventListener('keydown',function(e){if(e.key==='Escape')setModal(false)});
$('#outOk').addEventListener('click',function(){this.disabled=true;CY.logout().then(function(){location.href='/'})});

/* ---------- 加载 ---------- */
CY.api('users/me').then(function(r){
  if(r.status===401){CY.clearAuth();toLogin();return}
  if(!r.ok||!r.data){$('#loading').innerHTML='<div class="empty"><b>个人资料加载失败</b><span>请稍后刷新重试</span></div>';return}
  ME=r.data;try{localStorage.setItem('cyjy_user',JSON.stringify(ME))}catch(e){}
  $('#loading').hidden=true;$('#app').hidden=false;renderMe();tab((location.hash||'').slice(1)||'overview');CY.reveal();
  CY.api('users/me/favorites?page_size=100').then(function(r){FAV=r.ok&&r.data?r.data.items||[]:[];renderFav()}).catch(function(){FAV=[];renderFav()});
  CY.api('users/me/progress').then(function(r){PG=r.ok&&Array.isArray(r.data)?r.data:[];renderPg()}).catch(function(){PG=[];renderPg()});
}).catch(function(){$('#loading').innerHTML='<div class="empty"><b>网络连接失败</b><span>请检查网络后刷新</span></div>'});
})();
</script>
</body>
</html>
