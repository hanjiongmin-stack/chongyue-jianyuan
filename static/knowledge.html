<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>学习资源库 · 知识节点 | 崇岳鉴渊</title>
<!--cy:head-->
<style>
.filterbar{position:sticky;top:0;z-index:20;padding:14px 0;margin-bottom:8px;background:color-mix(in srgb,var(--bg) 82%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-bottom:1px solid var(--line);transition:top .5s var(--ease)}
body.nav-shown .filterbar{top:84px}
.fb-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.fb-row .search{flex:1 1 280px;max-width:460px}
.fb-row .seg{margin-left:auto}
.fb-cats{margin-top:12px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.fb-cats::-webkit-scrollbar{display:none}
.fb-cats .chip i{width:7px;height:7px;border-radius:50%;background:var(--c,var(--a1))}
.fb-cats .chip.on i{background:#fff}
.fb-tags{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px}
.fb-tags .chip{height:28px;padding:0 11px;font-size:12.5px}
.fb-tags .clear{font-size:12.5px;color:var(--muted);padding:0 8px;text-decoration:underline;text-underline-offset:3px}
.res-meta{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:18px 0 16px;font-size:13.5px;color:var(--muted)}
.res-meta b{color:var(--fg)}
.res-grid{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
@media(min-width:720px){.res-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(min-width:1080px){.res-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.rc{display:flex;flex-direction:column;gap:12px;padding:20px;border-radius:20px;background:var(--panel);border:1px solid var(--line);box-shadow:var(--panel-shadow);min-height:230px;overflow:hidden}
.rc:hover{border-color:var(--line-2)}
.rc::marker{display:none}
.rc-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.rc-cat{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--fg-2)}
.rc-cat i{width:8px;height:8px;border-radius:50%;background:var(--c);box-shadow:0 0 12px var(--c)}
.rc h3{font-size:1.06rem;font-weight:700;line-height:1.45;letter-spacing:-.01em;transition:color .3s}
.rc:hover h3{color:color-mix(in srgb,var(--c) 60%,var(--fg))}
.rc p{font-size:13.5px;color:var(--muted);line-height:1.7;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rc-tags{display:flex;flex-wrap:wrap;gap:6px}
.rc-meta{margin-top:auto;display:flex;align-items:center;gap:12px;padding-top:12px;border-top:1px dashed var(--line);font-size:12.5px;color:var(--muted)}
.ft{font:700 10.5px var(--font-mono);letter-spacing:.04em;padding:3px 7px;border-radius:6px;color:#fff;background:var(--fc,#64748b)}
.diff{display:inline-flex;gap:3px}
.diff i{width:6px;height:6px;border-radius:2px;background:var(--line-2)}
.diff i.on{background:var(--c)}
.views{margin-left:auto;display:inline-flex;align-items:center;gap:4px;font-family:var(--font-mono);font-size:12px}
.views svg{width:13px;height:13px}
.skel{min-height:230px;border-radius:20px}
.explore{margin-top:72px}
.explore .grid .card{min-height:0}
</style>
</head>
<body>
<!--cy:nav-->
<main>
  <section class="page-hero compact">
    <div class="ph-bg" aria-hidden="true"><i></i><i></i></div>
    <div class="container">
      <nav class="crumbs" aria-label="面包屑"><a href="/">首页</a><span>/</span><b style="font-weight:500;color:var(--fg-2)">学习资源库</b></nav>
      <span class="eyebrow" data-reveal><i></i>Resources · 学习资源库</span>
      <h1 class="ph-title" data-reveal style="--d:.05s">学习资源<span class="grad-text">与知识节点</span></h1>
      <p class="ph-sub" data-reveal style="--d:.1s">课件、真题、论文模板与备考资料按分类与标签整理，支持关键词检索、在线预览与收藏，覆盖公共基础课、专业核心课、学科竞赛、论文写作与升学备考。</p>
      <div class="ph-stats" data-reveal style="--d:.15s">
        <div class="ph-stat"><b id="stRes">—</b><span>份学习资源</span></div>
        <div class="ph-stat"><b id="stCat">—</b><span>大资源分类</span></div>
        <div class="ph-stat"><b id="stTag">—</b><span>个知识标签</span></div>
      </div>
    </div>
  </section>

  <div class="container">
    <div class="filterbar" id="filterbar">
      <div class="fb-row">
        <label class="search"><span class="sr-only">搜索资源</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <input class="input" type="search" id="searchInput" placeholder="搜索标题或简介，如「线性代数」「LaTeX 模板」" autocomplete="off"><kbd>/</kbd>
        </label>
        <div class="seg" id="sortSeg" role="tablist" aria-label="排序">
          <button type="button" data-sort="newest" class="on">最新</button>
          <button type="button" data-sort="popular">最热</button>
          <button type="button" data-sort="featured">精选优先</button>
        </div>
      </div>
      <div class="fb-cats" id="catFilters"><button class="chip on" type="button" data-cat="">全部</button></div>
      <div class="fb-tags" id="tagFilters"></div>
    </div>

    <div class="res-meta"><span id="statsBar">正在加载资源…</span><span id="pageInfo"></span></div>
    <div class="res-grid" id="resourceGrid" aria-live="polite"></div>
    <div class="pager" id="pagination"></div>

    <section class="explore">
      <div class="sec-head" data-reveal>
        <span class="eyebrow"><i style="--c:var(--a3)"></i>Explore · 专题板块</span>
        <h2 class="sec-title sm">没找到想要的？试试这些专题</h2>
      </div>
      <div class="grid g4">
        <a class="card spot" href="/math/" data-reveal style="--c1:#8b5cf6;--c2:#6366f1"><span class="card-ic">∑</span><h3>数学竞赛真题库</h3><p>美赛 / 国赛论文与赛题，PDF 在线阅读。</p><span class="more">进入<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 8h10M9 4l4 4-4 4"/></svg></span></a>
        <a class="card spot" href="/chemistry" data-reveal style="--d:.06s;--c1:#06b6d4;--c2:#10b981"><span class="card-ic">⚗</span><h3>高等化学知识库</h3><p>五大分支理论体系与习题精练。</p><span class="more">进入<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 8h10M9 4l4 4-4 4"/></svg></span></a>
        <a class="card spot" href="/signals-and-systems" data-reveal style="--d:.12s;--c1:#3b82f6;--c2:#06b6d4"><span class="card-ic">ω</span><h3>信号与系统</h3><p>8 大模块交互推导与核心公式。</p><span class="more">进入<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 8h10M9 4l4 4-4 4"/></svg></span></a>
        <a class="card spot" href="/knowledge-base" data-reveal style="--d:.18s;--c1:#10b981;--c2:#3b82f6"><span class="card-ic">知</span><h3>多维知识库</h3><p>跨学科高分笔记与课后全解。</p><span class="more">进入<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 8h10M9 4l4 4-4 4"/></svg></span></a>
      </div>
    </section>
  </div>
</main>
<!--cy:footer-->
<!--cy:tail-->
<script>
(function(){
'use strict';
var $=CY.$,$$=CY.$$,esc=CY.esc;
var API='/api/v1';
var CAT_COLOR={'public-basics':'#818cf8','major-core':'#60a5fa','competition':'#a78bfa','ai-coding':'#f472b6','thesis':'#fbbf24','research':'#fb7185','exam-prep':'#34d399','knowledge-base':'#22d3ee','tools':'#94a3b8','high-chem':'#2dd4bf'};
var FT_COLOR={PDF:'#ef4444',ZIP:'#f59e0b',RAR:'#f59e0b',PPTX:'#f97316',PPT:'#f97316',DOCX:'#3b82f6',DOC:'#3b82f6',XLSX:'#16a34a',MD:'#64748b',TEX:'#0d9488'};
var params=new URLSearchParams(location.search);
var state={category:params.get('category')||'',tag:params.get('tag')||'',search:params.get('q')||'',page:+(params.get('page')||1)||1,page_size:18,sort:params.get('sort')||'newest'};
var allTags=[],cats=[];

function qs(o){return Object.keys(o).filter(function(k){return o[k]!==''&&o[k]!=null}).map(function(k){return encodeURIComponent(k)+'='+encodeURIComponent(o[k])}).join('&')}
function fetchJSON(u){return fetch(u).then(function(r){if(!r.ok)throw new Error(r.status);return r.json()})}
function syncURL(){var q={category:state.category,tag:state.tag,q:state.search,sort:state.sort==='newest'?'':state.sort,page:state.page>1?state.page:''};var s=qs(q);try{history.replaceState(null,'',location.pathname+(s?'?'+s:''))}catch(e){}}

function renderCats(){
  var box=$('#catFilters');
  box.innerHTML='<button class="chip'+(state.category===''?' on':'')+'" type="button" data-cat="">全部</button>'+cats.map(function(c){
    return '<button class="chip'+(state.category===c.slug?' on':'')+'" type="button" data-cat="'+esc(c.slug)+'" style="--c:'+(CAT_COLOR[c.slug]||'#a78bfa')+'" title="'+esc(c.description)+'"><i></i>'+esc(c.name)+' <small>'+c.resource_count+'</small></button>';
  }).join('');
}
function renderTags(){
  var box=$('#tagFilters'),rel=allTags.filter(function(t){return t.resource_count>0});
  if(!rel.length){box.innerHTML='';return}
  box.innerHTML=rel.map(function(t){return '<button class="chip'+(state.tag===t.slug?' on':'')+'" type="button" data-tag="'+esc(t.slug)+'"># '+esc(t.name)+' <small>'+t.resource_count+'</small></button>'}).join('')+(state.tag?'<button class="clear" type="button" data-clear>清除标签</button>':'');
}
function skeleton(){$('#resourceGrid').innerHTML=Array.from({length:6},function(){return '<div class="skeleton skel"></div>'}).join('')}
function card(r,i){
  var c=CAT_COLOR[r.category_slug]||'#a78bfa',ft=(r.file_type||'').toUpperCase();
  var tags=(r.tags||[]).slice(0,3).map(function(t){return '<span class="tag">#'+esc(t.name)+'</span>'}).join('');
  var diff='';for(var k=1;k<=5;k++)diff+='<i'+(k<=r.difficulty?' class="on"':'')+'></i>';
  return '<a class="rc spot" href="/knowledge/'+r.id+'" data-reveal style="--c:'+c+';--d:'+(i*.04).toFixed(2)+'s" data-tilt>'+
    '<div class="rc-top"><span class="rc-cat"><i></i>'+esc(r.category_name)+'</span>'+(r.is_featured?'<span class="badge">精选</span>':'')+'</div>'+
    '<h3>'+esc(r.title)+'</h3><p>'+esc(r.description)+'</p>'+(tags?'<div class="rc-tags">'+tags+'</div>':'')+
    '<div class="rc-meta">'+(ft?'<span class="ft" style="--fc:'+(FT_COLOR[ft]||'#64748b')+'">'+esc(ft)+'</span>':'')+(r.file_size?'<span>'+esc(r.file_size)+'</span>':'')+
    '<span class="diff" title="难度 '+r.difficulty+'/5">'+diff+'</span>'+
    '<span class="views" title="浏览次数"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>'+(r.view_count||0)+'</span></div></a>';
}
function loadResources(){
  skeleton();syncURL();
  var p={category:state.category,tag:state.tag,search:state.search,page:state.page,page_size:state.page_size,sort:state.sort};
  return fetchJSON(API+'/resources?'+qs(p)).then(function(d){
    var grid=$('#resourceGrid');
    if(!d.items.length){
      grid.innerHTML='<div class="empty" style="grid-column:1/-1"><span class="em-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></span><b>没有找到匹配的资源</b><span>换个关键词，或者清除分类与标签筛选再试试</span><button class="btn btn-ghost btn-sm" type="button" data-reset>清除全部筛选</button></div>';
    }else grid.innerHTML=d.items.map(card).join('');
    var cat=cats.filter(function(c){return c.slug===state.category})[0];
    $('#statsBar').innerHTML=(cat?esc(cat.name)+' · ':'')+'共 <b>'+d.total+'</b> 份资源'+(state.search?' · 关键词「'+esc(state.search)+'」':'');
    $('#pageInfo').textContent=d.total_pages>1?'第 '+d.page+' / '+d.total_pages+' 页':'';
    renderPager(d);
  }).catch(function(){
    $('#resourceGrid').innerHTML='<div class="empty" style="grid-column:1/-1"><b>加载失败</b><span>请检查网络连接后重试</span><button class="btn btn-ghost btn-sm" type="button" data-retry>重新加载</button></div>';
    $('#statsBar').textContent='';$('#pagination').innerHTML='';
  });
}
function renderPager(d){
  var box=$('#pagination');if(d.total_pages<=1){box.innerHTML='';return}
  var h='<button type="button" data-page="'+(d.page-1)+'"'+(d.page<=1?' disabled':'')+' aria-label="上一页">‹</button>';
  for(var i=1;i<=d.total_pages;i++){
    if(i===1||i===d.total_pages||Math.abs(i-d.page)<=2)h+='<button type="button" data-page="'+i+'"'+(i===d.page?' class="on" aria-current="page"':'')+'>'+i+'</button>';
    else if(Math.abs(i-d.page)===3)h+='<button type="button" disabled>…</button>';
  }
  box.innerHTML=h+'<button type="button" data-page="'+(d.page+1)+'"'+(d.page>=d.total_pages?' disabled':'')+' aria-label="下一页">›</button>';
}
function scrollToList(){var fb=$('#filterbar'),y=fb.getBoundingClientRect().top+window.scrollY-10;if(window.scrollY>y)window.scrollTo({top:y,behavior:CY.reduced?'auto':'smooth'})}

document.addEventListener('click',function(e){
  var c=e.target.closest('#catFilters [data-cat]');
  if(c){var v=c.getAttribute('data-cat');state.category=(v===state.category&&v!=='')?'':v;state.tag='';state.page=1;renderCats();renderTags();loadResources();return}
  var t=e.target.closest('#tagFilters [data-tag]');
  if(t){var s=t.getAttribute('data-tag');state.tag=s===state.tag?'':s;state.page=1;renderTags();loadResources();return}
  if(e.target.closest('#tagFilters [data-clear]')){state.tag='';state.page=1;renderTags();loadResources();return}
  var so=e.target.closest('#sortSeg [data-sort]');
  if(so){state.sort=so.getAttribute('data-sort');state.page=1;$$('#sortSeg button').forEach(function(b){b.classList.toggle('on',b===so)});loadResources();return}
  var pg=e.target.closest('#pagination [data-page]');
  if(pg&&!pg.disabled){state.page=+pg.getAttribute('data-page');loadResources().then(scrollToList);return}
  if(e.target.closest('[data-reset]')){state={category:'',tag:'',search:'',page:1,page_size:18,sort:state.sort};$('#searchInput').value='';renderCats();renderTags();loadResources();return}
  if(e.target.closest('[data-retry]'))loadResources();
});
var timer;
$('#searchInput').value=state.search;
$('#searchInput').addEventListener('input',function(){var v=this.value.trim();clearTimeout(timer);timer=setTimeout(function(){state.search=v;state.page=1;loadResources()},350)});
document.addEventListener('keydown',function(e){var tag=(e.target.tagName||'').toLowerCase();if(e.key==='/'&&tag!=='input'&&tag!=='textarea'){e.preventDefault();$('#searchInput').focus()}});
$$('#sortSeg button').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-sort')===state.sort)});


Promise.all([fetchJSON(API+'/categories').catch(function(){return []}),fetchJSON(API+'/tags').catch(function(){return []})]).then(function(r){
  cats=r[0]||[];allTags=r[1]||[];
  var total=cats.reduce(function(s,c){return s+(c.resource_count||0)},0);
  $('#stRes').setAttribute('data-count',total);$('#stCat').setAttribute('data-count',cats.length);$('#stTag').setAttribute('data-count',allTags.length);
  $$('.ph-stat b[data-count]').forEach(function(b){CY.countUp(b)});
  renderCats();renderTags();return loadResources();
});
})();
</script>
</body>
</html>
