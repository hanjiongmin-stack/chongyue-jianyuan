<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>资源详情 | 崇岳鉴渊</title>
<!--cy:head-->
<style>
.kd-hero{padding-bottom:28px}
.kd-meta{margin-top:20px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;font-size:13.5px;color:var(--muted)}
.kd-meta span{display:inline-flex;align-items:center;gap:6px}
.kd-meta svg{width:14px;height:14px}
.diff{display:inline-flex;gap:3px}.diff i{width:7px;height:7px;border-radius:2px;background:var(--line-2)}.diff i.on{background:var(--c,var(--a1))}
.kd-tags{margin-top:14px;display:flex;flex-wrap:wrap;gap:6px}
.kd-layout{display:grid;gap:28px;grid-template-columns:minmax(0,1fr);padding-bottom:40px}
@media(min-width:1080px){.kd-layout{grid-template-columns:minmax(0,1fr) 260px;gap:48px}}
.actbar{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;padding:16px 18px;border-radius:18px;margin-bottom:24px}
.fav{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-radius:99px;border:1px solid var(--line-2);background:var(--card);font-size:14px;color:var(--fg-2);transition:all .3s var(--ease)}
.fav svg{width:17px;height:17px;transition:transform .4s var(--ease)}
.fav:hover{border-color:var(--faint);color:var(--fg)}
.fav.on{color:#fff;border-color:transparent;background:linear-gradient(135deg,#f43f5e,#ec4899)}
.fav.on svg{fill:currentColor;transform:scale(1.15)}
.prog{display:flex;align-items:center;gap:10px;flex:1;min-width:240px}
.prog input[type=range]{flex:1;accent-color:#7c5cff;min-width:100px}
.prog b{font-family:var(--font-mono);font-size:13px;min-width:44px;text-align:right}
.lghint{font-size:14px;color:var(--muted)}.lghint a{color:var(--fg);text-decoration:underline;text-underline-offset:3px}
.kd-desc{font-size:17px;line-height:1.85;color:var(--fg-2);padding:18px 20px;border-left:3px solid var(--a1);background:var(--card);border-radius:0 14px 14px 0;margin-bottom:28px}
.prose h1{display:none}
.prose pre{position:relative}
.cp{position:absolute;top:10px;right:10px;padding:4px 10px;border-radius:8px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);font-size:12px;color:rgba(255,255,255,.6);opacity:0;transition:opacity .2s,color .2s}
.prose pre:hover .cp{opacity:1}.cp:hover{color:#fff}
.time-badge{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:12px;font-size:14px;font-weight:600;color:var(--a1);background:color-mix(in srgb,var(--a1) 12%,transparent);border:1px solid color-mix(in srgb,var(--a1) 28%,transparent)}
.placeholder{color:var(--faint);font-style:italic}
.toc{position:sticky;top:110px;align-self:start;display:none;padding:18px;border-radius:18px}
@media(min-width:1080px){.toc{display:block}}
.toc h4{font-size:12px;font-family:var(--font-mono);letter-spacing:.08em;color:var(--faint);margin-bottom:10px}
.toc a{display:block;padding:5px 10px;border-radius:8px;font-size:13.5px;color:var(--muted);border-left:2px solid transparent;transition:all .25s}
.toc a.h3{padding-left:22px;font-size:12.5px}
.toc a:hover{color:var(--fg);background:var(--card-2)}
.toc a.on{color:var(--fg);border-left-color:var(--a1);background:var(--card-2)}
.files{margin-top:36px;padding:20px;border-radius:20px}
.files h2{font-size:1.15rem;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:10px}
.fgrp{border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-top:10px}
.fgrp-h{display:flex;align-items:center;gap:8px;width:100%;padding:11px 14px;background:var(--card);font-size:14px;font-weight:600;text-align:left}
.fgrp-h svg{width:12px;height:12px;transition:transform .3s}
.fgrp.open .fgrp-h svg{transform:rotate(90deg)}
.fgrp-h small{margin-left:auto;font-family:var(--font-mono);color:var(--faint);font-weight:400}
.fgrp-b{display:none}.fgrp.open .fgrp-b{display:block}
.frow{display:flex;align-items:center;gap:12px;padding:10px 14px;border-top:1px solid var(--line);font-size:13.5px}
.frow .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.frow .sz{font-family:var(--font-mono);font-size:12px;color:var(--faint)}
.pv{margin-top:14px;border-radius:16px;overflow:hidden;border:1px solid var(--line-2);background:var(--solid)}
.pv-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);font-size:13px}
.pv iframe{width:100%;height:72vh;border:0;background:#fff;display:block}
.pv pre{margin:0;max-height:60vh;overflow:auto;padding:16px;font:12.5px/1.7 var(--font-mono);white-space:pre-wrap;background:var(--code-bg);color:#e8e8ee}
.pv img,.pv video{display:block;max-width:100%;margin:0 auto}
.related{margin-top:56px}
.rel-grid{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
@media(min-width:720px){.rel-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(min-width:1080px){.rel-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.state{padding:120px 20px;text-align:center}
</style>
</head>
<body>
<!--cy:nav-->
<main id="app">
  <div class="state"><div class="spinner" style="margin:0 auto 14px"></div><span class="muted">正在加载资源…</span></div>
</main>
<!--cy:footer-->
<!--cy:tail-->
<script>
(function(){
'use strict';
var $=CY.$,$$=CY.$$,esc=CY.esc;
var API='/api/v1',id=parseInt(location.pathname.split('/').filter(Boolean).pop(),10);
var token=CY.token(),R=null,isFav=false,st='not_started',pct=0;
var CAT_COLOR={'public-basics':'#818cf8','major-core':'#60a5fa','competition':'#a78bfa','ai-coding':'#f472b6','thesis':'#fbbf24','research':'#fb7185','exam-prep':'#34d399','knowledge-base':'#22d3ee','tools':'#94a3b8','high-chem':'#2dd4bf'};
var ICON={eye:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>',user:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0116 0"/></svg>',dl:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>',file:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 3H6a1 1 0 00-1 1v16a1 1 0 001 1h12a1 1 0 001-1V8z"/><path d="M14 3v5h5"/></svg>',clock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',heart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.8 4.6a5.5 5.5 0 00-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 10-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 000-7.8z"/></svg>'};
function auth(){return {'Authorization':'Bearer '+token}}
function fail(msg){$('#app').innerHTML='<div class="state"><div class="empty"><span class="em-ic">'+ICON.file+'</span><b>'+esc(msg)+'</b><a class="btn btn-ghost btn-sm" href="/knowledge">返回资源列表</a></div></div>'}

/* ---------- safe markdown ---------- */
function inline(s){return s.replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\[在此粘贴([^\]]+)\]|\[粘贴([^\]]+)\]/g,function(m,a,b){return '<span class="placeholder">['+(a||b)+']</span>'})}
function md(src){
  var text=esc(src||'').replace(/\r\n?/g,'\n'),codes=[];
  text=text.replace(/```(\w*)\n([\s\S]*?)```/g,function(_,lang,code){codes.push('<pre><code>'+code.replace(/\n$/,'')+'</code><button class="cp" type="button">复制</button></pre>');return '\u0000'+(codes.length-1)+'\u0000'});
  var lines=text.split('\n'),out=[],para=[],list=null,table=[],hid=0;
  function flushP(){if(para.length){out.push('<p>'+inline(para.join('<br>'))+'</p>');para=[]}}
  function flushL(){if(list){out.push('<'+list.t+'>'+list.items.map(function(i){return '<li>'+inline(i)+'</li>'}).join('')+'</'+list.t+'>');list=null}}
  function flushT(){
    if(!table.length)return;
    var rows=table.map(function(l){return l.replace(/^\|/,'').replace(/\|$/,'').split('|').map(function(c){return c.trim()})});
    var head=null;if(rows.length>1&&rows[1].every(function(c){return /^:?-{2,}:?$/.test(c)})){head=rows[0];rows=rows.slice(2)}
    out.push('<table>'+(head?'<thead><tr>'+head.map(function(c){return '<th>'+inline(c)+'</th>'}).join('')+'</tr></thead>':'')+'<tbody>'+rows.map(function(r){return '<tr>'+r.map(function(c){return '<td>'+inline(c)+'</td>'}).join('')+'</tr>'}).join('')+'</tbody></table>');
    table=[];
  }
  lines.forEach(function(raw){
    var l=raw.replace(/\s+$/,''),m;
    if(/^\|.+\|$/.test(l.trim())){flushP();flushL();table.push(l.trim());return}else flushT();
    if(/^\u0000\d+\u0000$/.test(l.trim())){flushP();flushL();out.push(l.trim());return}
    if(!l.trim()){flushP();flushL();return}
    if((m=l.match(/^(#{1,4})\s+(.+)$/))){flushP();flushL();var lv=m[1].length,idn='sec-'+(++hid);out.push('<h'+lv+(lv>=2&&lv<=3?' id="'+idn+'"':'')+'>'+inline(m[2])+'</h'+lv+'>');return}
    if(/^-{3,}$/.test(l.trim())){flushP();flushL();out.push('<hr>');return}
    if((m=l.match(/^&gt;\s?(.*)$/))){flushP();flushL();out.push('<blockquote>'+inline(m[1])+'</blockquote>');return}
    if((m=l.match(/^\*\*预计学习时间：\*\*\s*(.+)$/))){flushP();flushL();out.push('<div class="time-badge">'+ICON.clock.replace('<svg','<svg width="16" height="16"')+'预计学习时间：'+inline(m[1])+'</div>');return}
    if((m=l.match(/^\s*[-*]\s+(.+)$/))){flushP();if(!list||list.t!=='ul'){flushL();list={t:'ul',items:[]}}list.items.push(m[1]);return}
    if((m=l.match(/^\s*\d+[.、]\s+(.+)$/))){flushP();if(!list||list.t!=='ol'){flushL();list={t:'ol',items:[]}}list.items.push(m[1]);return}
    flushL();para.push(l);
  });
  flushP();flushL();flushT();
  return out.join('\n').replace(/\u0000(\d+)\u0000/g,function(_,i){return codes[+i]});
}

/* ---------- render ---------- */
function render(r){
  R=r;var c=CAT_COLOR[r.category_slug]||'#a78bfa';
  document.title=r.title+' | 崇岳鉴渊';
  var diff='';for(var k=1;k<=5;k++)diff+='<i'+(k<=(r.difficulty||1)?' class="on"':'')+'></i>';
  var tags=(r.tags||[]).map(function(t){return '<a class="tag" href="/knowledge?tag='+encodeURIComponent(t.slug)+'">#'+esc(t.name)+'</a>'}).join('');
  var when=r.updated_at||r.created_at;var dstr=when?new Date(when).toLocaleDateString('zh-CN'):'';
  var act=token?'<div class="panel actbar"><button class="fav" id="fav" type="button">'+ICON.heart+'<span>收藏</span></button><div class="seg" id="stSeg"><button type="button" data-s="not_started">未开始</button><button type="button" data-s="in_progress">学习中</button><button type="button" data-s="completed">已完成</button></div><label class="prog"><span class="muted" style="font-size:13px">进度</span><input type="range" min="0" max="100" value="0" id="pSlider" aria-label="学习进度"><b id="pVal">0%</b></label></div>'
    :'<div class="panel actbar"><span class="lghint"><a href="/login?redirect='+encodeURIComponent(location.pathname)+'">登录</a> 后可以收藏资源、记录学习进度</span></div>';
  var body=md(r.content||'');
  $('#app').innerHTML=
    '<section class="page-hero kd-hero"><div class="ph-bg" aria-hidden="true"><i></i><i></i></div><div class="container">'+
      '<nav class="crumbs" aria-label="面包屑"><a href="/">首页</a><span>/</span><a href="/knowledge">学习资源</a><span>/</span><a href="/knowledge?category='+encodeURIComponent(r.category_slug)+'">'+esc(r.category_name)+'</a></nav>'+
      '<span class="eyebrow" data-reveal style="--c:'+c+'"><i></i>'+esc(r.category_name)+(r.is_featured?' · 精选':'')+'</span>'+
      '<h1 class="ph-title" data-reveal style="--d:.05s;font-size:clamp(1.9rem,4.6vw,3.2rem)">'+esc(r.title)+'</h1>'+
      '<div class="kd-meta" data-reveal style="--d:.1s;--c:'+c+'">'+(r.author?'<span>'+ICON.user+esc(r.author)+'</span>':'')+(r.source?'<span>'+esc(r.source)+'</span>':'')+
        '<span title="难度 '+(r.difficulty||1)+'/5">难度 <span class="diff">'+diff+'</span></span><span>'+ICON.eye+(r.view_count||0)+' 次阅读</span><span>'+ICON.dl+(r.download_count||0)+' 次下载</span>'+
        (r.file_type?'<span>'+ICON.file+esc(r.file_type)+(r.file_size?' · '+esc(r.file_size):'')+'</span>':'')+(dstr?'<span>'+ICON.clock+'更新于 '+dstr+'</span>':'')+'</div>'+
      (tags?'<div class="kd-tags" data-reveal style="--d:.14s">'+tags+'</div>':'')+
    '</div></section>'+
    '<div class="container kd-layout"><article>'+act+
      (r.description?'<p class="kd-desc">'+esc(r.description)+'</p>':'')+
      '<div class="prose" id="prose">'+(body||'<p class="muted">该资源暂无正文内容。</p>')+'</div>'+
      '<section class="panel files" id="files"><h2>'+ICON.file.replace('<svg','<svg width="18" height="18"')+'附件文件</h2><div id="fileBox"><div class="spinner"></div></div></section>'+
      '<section class="related" id="related" hidden><div class="sec-head" style="margin-bottom:22px"><span class="eyebrow"><i style="--c:'+c+'"></i>Related · 同类资源</span></div><div class="rel-grid" id="relGrid"></div></section>'+
    '</article><aside class="panel toc" id="toc" hidden><h4>目录</h4><nav id="tocLinks"></nav></aside></div>';
  buildToc();bindCopy();
  if(token){
    $('#fav').addEventListener('click',toggleFav);
    $$('#stSeg button').forEach(function(b){b.addEventListener('click',function(){setStatus(b.getAttribute('data-s'))})});
    var t;$('#pSlider').addEventListener('input',function(){var v=+this.value;$('#pVal').textContent=v+'%';clearTimeout(t);t=setTimeout(function(){onSlider(v)},250)});
    loadFav();loadProg();
  }
  loadFiles();loadRelated();
}
function buildToc(){
  var hs=$$('#prose h2[id],#prose h3[id]');if(hs.length<2)return;
  $('#tocLinks').innerHTML=hs.map(function(h){return '<a href="#'+h.id+'" class="'+h.tagName.toLowerCase()+'">'+esc(h.textContent)+'</a>'}).join('');
  $('#toc').hidden=false;
  if('IntersectionObserver' in window){
    var links=$$('#tocLinks a'),io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){links.forEach(function(a){a.classList.toggle('on',a.getAttribute('href')==='#'+e.target.id)})}})},{rootMargin:'-20% 0px -70% 0px'});
    hs.forEach(function(h){io.observe(h)});
  }
}
function bindCopy(){$$('#prose .cp').forEach(function(b){b.addEventListener('click',function(){var code=b.parentNode.querySelector('code').textContent;var done=function(){b.textContent='已复制';setTimeout(function(){b.textContent='复制'},1500)};if(navigator.clipboard)navigator.clipboard.writeText(code).then(done,function(){});})})}

/* ---------- files & preview ---------- */
function loadFiles(){
  fetch(API+'/resources/'+id+'/files').then(function(r){return r.json()}).then(function(d){
    var files=d.files||[],box=$('#fileBox');
    if(!files.length){box.innerHTML='<p class="muted" style="font-size:14px">该资源暂未上传附件文件。</p>';return}
    var groups={},order=[];
    files.forEach(function(f){var i=f.name.indexOf('/'),g=i>0?f.name.slice(0,i):'';if(!groups[g]){groups[g]=[];order.push(g)}groups[g].push(f)});
    order.sort(function(a,b){return a===''?-1:b===''?1:a.localeCompare(b,'zh-CN',{numeric:true})});
    box.innerHTML=order.map(function(g,gi){
      return '<div class="fgrp'+(gi===0?' open':'')+'"><button class="fgrp-h" type="button"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4.5 3l3 3-3 3"/></svg>'+esc(g||'资源文件')+'<small>'+groups[g].length+'</small></button><div class="fgrp-b">'+groups[g].map(function(f){
        var name=g?f.name.slice(g.length+1):f.name,can=f.preview_type&&f.preview_type!=='none';
        return '<div class="frow"><span class="nm" title="'+esc(f.name)+'">'+esc(name)+'</span><span class="sz">'+esc(f.size)+'</span>'+(can?'<button class="btn btn-ghost btn-xs" type="button" data-pv="'+esc(f.url)+'" data-type="'+esc(f.preview_type)+'" data-name="'+esc(f.name)+'">预览</button>':'')+'<a class="btn btn-primary btn-xs" href="'+esc(f.url)+'" download>下载</a></div>';
      }).join('')+'</div></div>';
    }).join('')+'<div id="pvBox"></div>';
  }).catch(function(){$('#fileBox').innerHTML='<p class="muted">附件列表加载失败</p>'});
}
document.addEventListener('click',function(e){
  var h=e.target.closest('.fgrp-h');if(h){h.parentNode.classList.toggle('open');return}
  var b=e.target.closest('[data-pv]');if(b)preview(b.getAttribute('data-pv'),b.getAttribute('data-type'),b.getAttribute('data-name'));
  if(e.target.closest('[data-pv-close]'))$('#pvBox').innerHTML='';
});
function preview(url,type,name){
  var box=$('#pvBox'),inner='';
  if(type==='pdf')inner='<iframe src="'+esc(url)+'" title="'+esc(name)+'"></iframe>';
  else if(type==='image')inner='<img src="'+esc(url)+'" alt="'+esc(name)+'">';
  else if(type==='video')inner='<video src="'+esc(url)+'" controls></video>';
  else if(type==='audio')inner='<div style="padding:16px"><audio src="'+esc(url)+'" controls style="width:100%"></audio></div>';
  else if(type==='pptx'||type==='docx')inner='<iframe src="'+API+'/resources/'+id+'/preview/'+name.split('/').map(encodeURIComponent).join('/')+'" title="'+esc(name)+'"></iframe>';
  else if(type==='text')inner='<pre id="pvText">加载中…</pre>';
  box.innerHTML='<div class="pv"><div class="pv-h"><b style="font-weight:600">'+esc(name)+'</b><span style="display:flex;gap:8px"><a class="btn btn-ghost btn-xs" href="'+esc(url)+'" target="_blank" rel="noopener">新标签页打开</a><button class="btn btn-ghost btn-xs" type="button" data-pv-close>关闭</button></span></div>'+inner+'</div>';
  if(type==='text')fetch(url).then(function(r){return r.text()}).then(function(t){$('#pvText').textContent=t.slice(0,200000)}).catch(function(){$('#pvText').textContent='预览失败'});
  box.scrollIntoView({behavior:CY.reduced?'auto':'smooth',block:'start'});
}

/* ---------- related ---------- */
function loadRelated(){
  fetch(API+'/resources?category='+encodeURIComponent(R.category_slug)+'&page_size=7&sort=popular').then(function(r){return r.json()}).then(function(d){
    var items=(d.items||[]).filter(function(x){return x.id!==R.id}).slice(0,6);if(!items.length)return;
    $('#relGrid').innerHTML=items.map(function(x,i){return '<a class="card spot" href="/knowledge/'+x.id+'" data-reveal style="--d:'+(i*.05)+'s"><span class="tag" style="align-self:flex-start">'+esc(x.file_type||'资料')+'</span><h3>'+esc(x.title)+'</h3><p style="display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">'+esc(x.description)+'</p><span class="more">查看<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 8h10M9 4l4 4-4 4"/></svg></span></a>'}).join('');
    $('#related').hidden=false;
  }).catch(function(){});
}

/* ---------- favorite & progress ---------- */
function toggleFav(){
  var b=$('#fav');b.disabled=true;
  fetch(API+'/users/me/favorites/'+id,{method:isFav?'DELETE':'POST',headers:auth()}).then(function(r){if(r.status===401)throw 401;return r.json()}).then(function(d){isFav=!!d.is_favorited;favUI();CY.toast(isFav?'已加入收藏':'已取消收藏','ok')}).catch(function(e){CY.toast(e===401?'登录已过期，请重新登录':'操作失败，请稍后重试','err')}).then(function(){b.disabled=false});
}
function loadFav(){fetch(API+'/users/me/favorites/'+id+'/check',{headers:auth()}).then(function(r){return r.ok?r.json():null}).then(function(d){if(d){isFav=!!d.is_favorited;favUI()}}).catch(function(){})}
function favUI(){var b=$('#fav');if(!b)return;b.classList.toggle('on',isFav);$('span',b).textContent=isFav?'已收藏':'收藏'}
function setStatus(s){st=s;if(s==='completed')pct=100;if(s==='not_started')pct=0;if(s==='in_progress'&&(pct===0||pct===100))pct=10;save();progUI()}
function onSlider(v){pct=v;st=v>=100?'completed':v>0?'in_progress':'not_started';save();progUI()}
function save(){fetch(API+'/users/me/progress/'+id,{method:'POST',headers:Object.assign({'Content-Type':'application/json'},auth()),body:JSON.stringify({status:st,progress_percent:pct})}).then(function(r){if(!r.ok)throw 0}).catch(function(){CY.toast('进度保存失败','err')})}
function loadProg(){fetch(API+'/users/me/progress/'+id,{headers:auth()}).then(function(r){return r.ok?r.json():null}).then(function(d){if(d){st=d.status||st;pct=d.progress_percent||0}progUI()}).catch(progUI)}
function progUI(){$$('#stSeg button').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-s')===st)});var s=$('#pSlider');if(s)s.value=pct;var v=$('#pVal');if(v)v.textContent=pct+'%'}

if(isNaN(id))fail('无效的资源编号');
else fetch(API+'/resources/'+id).then(function(r){if(r.status===404)throw new Error('404');if(!r.ok)throw new Error('x');return r.json()}).then(render).catch(function(e){fail(e.message==='404'?'资源不存在或已下线':'资源加载失败，请稍后重试')});
})();
</script>
</body>
</html>
